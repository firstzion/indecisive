name: Indecisive
options:
  bundleIdPrefix: com.indecisive
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_ASSET_PATHS: ""

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

targets:
  # Everything except the `@main` entry point. It lives in a framework so the
  # unit tests can link it directly instead of being hosted by the app: on
  # iOS you cannot `@testable import` an *app* module without the test bundle
  # running inside that app, which meant every unit test run also launched the
  # real app — seeding the real on-disk store and leaving Home's `@Query`
  # observers live in the test process, alongside the in-memory containers the
  # tests themselves create. That is what the intermittent `EXC_BREAKPOINT`
  # inside a `_SwiftData_SwiftUI` save observer was blamed on (REVIEW.md).
  #
  # The source folders deliberately keep their paths. Moving them under
  # `IndecisiveKit/` would be tidier, but the module boundary is what does the
  # work here, and a rename of every file in the app buys nothing.
  IndecisiveKit:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Indecisive/App
        excludes:
          - IndecisiveApp.swift
      - path: Indecisive/Model
      - path: Indecisive/Logic
      - path: Indecisive/Skins
      - path: Indecisive/Features
      # The fonts come with the framework rather than the app, so a test
      # bundle that never launches the app still has them. They are no longer
      # registered by `UIAppFonts` (which only reads the *main* bundle) but by
      # `FontRegistry.ensureRegistered()`, from this bundle, at launch.
      - path: Indecisive/Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indecisive.app.kit
        PRODUCT_NAME: IndecisiveKit
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 29DR9P3A6R
        DEFINES_MODULE: YES
        # It ships inside the app; there is nothing to install on its own.
        SKIP_INSTALL: YES

  Indecisive:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Just the `@main` App struct and the asset catalog. The asset catalog
    # stays here because all three of its entries are consumed by the app —
    # `AppIcon` and `AccentColor` by build settings, `LaunchBackground` by
    # `UILaunchScreen` — and no code looks anything up by name.
    sources:
      - path: Indecisive/App/IndecisiveApp.swift
      - path: Indecisive/Resources/Assets.xcassets
    dependencies:
      - target: IndecisiveKit
    info:
      path: Indecisive/Info.plist
      properties:
        CFBundleDisplayName: "Rand-o-matic"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: "public.app-category.productivity"
        # The app is fully offline with no custom cryptography — declaring
        # this up front means every TestFlight/App Store Connect upload
        # skips the export-compliance question instead of stopping to ask
        # it every time. Revisit if networking or crypto is ever added.
        ITSAppUsesNonExemptEncryption: false
        # Both read from the build settings below rather than holding literals,
        # so a release is bumped in `project.yml` — the file under source
        # control — instead of in the generated (and gitignored) Info.plist,
        # which is the only place they used to live. Keeping them as build
        # settings also means Xcode's own version fields and `agvtool` see
        # them.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # `armv7` is a 32-bit-CPU requirement left over from an old
        # template; no iOS 17+ device (this app's deployment target) has
        # one, and the binary itself is arm64-only — App Store Connect
        # rejects that mismatch.
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # No `UIAppFonts` any more. It only registers fonts found in the
        # *main* bundle, and the fonts now ship with `IndecisiveKit` so that
        # a test bundle which never launches the app still gets them —
        # without that, every snapshot would render in the system font.
        # `FontRegistry.ensureRegistered()` registers them from the framework
        # bundle instead, at launch and before any font lookup.
    settings:
      base:
        # Set explicitly (so `bundleIdPrefix` above, which would otherwise
        # derive `com.indecisive.Indecisive` from the target name, doesn't
        # decide it) and deliberately matching the prefix and the README.
        # This used to be `com.Randomatic.app`, which agreed with neither and
        # isn't reverse-DNS-conventional. A bundle ID is effectively permanent
        # from the first App Store Connect submission onward — don't churn it
        # after that.
        PRODUCT_BUNDLE_IDENTIFIER: com.indecisive.app
        PRODUCT_NAME: Indecisive
        # The release version and build number. Bump these here; the
        # Info.plist keys read them (see `CFBundleShortVersionString` above).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        # Pinned at the target level: the project-level default above
        # wasn't enough to keep this iPhone-only (xcodegen 2.46.0 still
        # emitted "1,2" here without an explicit target-level override —
        # see the sibling comment on DEVELOPMENT_TEAM for why anything
        # Xcode/xcodegen can silently drift needs pinning explicitly).
        TARGETED_DEVICE_FAMILY: "1"
        # Xcode resolved this automatically the first time the project was
        # opened with a signed-in Apple Developer account. It lives only in
        # the generated .xcodeproj by default, so without pinning it here,
        # the next `xcodegen generate` would silently drop it and archiving
        # would fail signing until someone re-picks the team in Xcode.
        DEVELOPMENT_TEAM: 29DR9P3A6R
    scheme:
      testTargets:
        - IndecisiveTests
        - IndecisiveUITests
      gatherCoverageData: true

  IndecisiveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IndecisiveTests
    # Depends on the framework, not the app — which is the whole point. A
    # unit-test target that depends on an application target gets a
    # `TEST_HOST`, and XCTest then launches the real app to run the tests
    # inside it. Linking the framework directly means no host app, no second
    # `ModelContainer` on the real on-disk store, and no live `@Query`
    # observers belonging to a screen no test asked for.
    dependencies:
      - target: IndecisiveKit
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  IndecisiveUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IndecisiveUITests
    dependencies:
      - target: Indecisive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Indecisive
